apiVersion: agent-env/v1
kind: AgentParams
agentId: parallel-pipeline
title: Parallel Pipeline (Debate)
description: PRO/CON が開弁→反論を並列で交わし、最後に判定員が評決する。
fields:
  - id: message
    type: text
    label: ディベート論題
    required: true
    placeholder: "例: Remote work should be the default for small engineering teams"
    default: "Remote work should be the default for small engineering teams"
  - id: maxClaims
    type: number
    label: 開弁の主張数の目安
    required: false
    default: 4
    min: 2
    max: 6
    step: 1
    description: 開弁エージェント指示の参考値（state 経由）。
