apiVersion: agent-env/v1
kind: AgentParams
agentId: character-chat
title: Character Chat
description: キャラなりきり対話のみ（ツールなし）。
objectiveField: message
fields:
  - id: message
    type: text
    label: メッセージ
    required: true
    placeholder: カフェのバリスタに話しかける
    default: "今日のおすすめは？"
  - id: model
    type: model
    label: Model
    required: false
    description: 利用可能な provider のモデルから選択（provider:model）
    default: cursor:auto
