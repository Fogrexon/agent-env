apiVersion: agent-env/v1
kind: AgentParams
agentId: hello
title: Hello
description: Minimal single-agent greeting demo (Cursor SDK when configured).
fields:
  - id: message
    type: text
    label: 初回クエリ
    required: true
    placeholder: エージェントへの最初のメッセージ
    default: "Hello — briefly introduce what you can do."
  - id: documents
    type: files
    label: 添付ドキュメント（PDF / Markdown / テキスト）
    delivery: content
    required: false
    description: provider が該当 MIME に非対応ならテキスト抽出して渡します。
    accept:
      - .pdf
      - .md
      - .txt
      - .csv
      - .json
      - .yaml
