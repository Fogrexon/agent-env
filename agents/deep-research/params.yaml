apiVersion: agent-env/v1
kind: AgentParams
agentId: deep-research
title: Deep Research
description: 本格 deep research — 問い分解とレポート成功条件の定義 → Web/X 徹底探索 → ギャップ埋め → 読者向け構成で一枚のレポート（画像DL・MD/PDF 書き出し / Cursor SDK 既定 / Tavily + Grok X）。
fields:
  - id: message
    type: text
    label: リサーチトピック / 問い
    required: true
    placeholder: 最終レポートで何を判断・理解したいかまで含めて書くとよい
    default: "What are the current best practices for securing LLM agent tool-calling, and which mitigations matter most in production?"
  - id: audience
    type: string
    label: 想定読者（任意）
    required: false
    placeholder: "例: 本番エージェント基盤を設計するエンジニアリングマネージャ"
    description: スコープ段階で読者像を強めるヒント。空ならエージェントが推定する。
  - id: decisionFocus
    type: text
    label: レポートで答えたい判断（任意）
    required: false
    placeholder: "例: どの防御を最初のスプリントで必ず入れるべきか"
    description: 「最終的に何が分かればよいか」のヒント。
