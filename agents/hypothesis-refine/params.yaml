apiVersion: agent-env/v1
kind: AgentParams
agentId: hypothesis-refine
title: Hypothesis Refine
description: 親/子が調査→累積 HTML 提出→Director がレポートから深掘り点を選び調査継続（Cursor grok-4.5 / Tavily または Brave）。
objectiveField: message
fields:
  - id: message
    type: text
    label: 大目標
    required: true
    placeholder: 調査して根拠付きで答えたいこと（市場調査・競合比較・コード調査など）
    default: "国内の LLM エージェント開発基盤（オーケストレーション / 評価ハーネス）の市場動向を調べ、主要プレイヤー・差別化軸・導入時の留意点を根拠付き HTML レポートにまとめよ。"
  - id: repo
    type: string
    label: 調査対象（ローカル絶対パス or GitHub HTTPS URL・任意）
    required: false
    placeholder: "空でも Web 調査可。例: /path/to/repo または https://github.com/org/repo"
  - id: maxBatches
    type: number
    label: 1 サイクル内の親↔子バッチ上限
    required: false
    default: 8
    min: 1
    max: 20
    step: 1
  - id: maxQualityRounds
    type: number
    label: Director 深掘り差し戻しを含む外側ラウンド上限
    required: false
    default: 3
    min: 1
    max: 8
    step: 1
  - id: parallelSlots
    type: number
    label: 並列ワーカー数
    required: false
    default: 3
    min: 1
    max: 5
    step: 1
  - id: allowWrite
    type: boolean
    label: 調査対象リポへの write を許可（レポート用 write は常時可）
    required: false
    default: false
