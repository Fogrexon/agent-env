apiVersion: agent-env/v1
kind: AgentParams
agentId: security-audit
title: Security Audit → PR
description: 並列セキュリティ scout → Finding/Patch → 別モデル評価（REVISE 時はパッチ修正ループ）→ 構造化 GitHub PR（Cursor SDK 既定、write/PR は env ゲート）。
fields:
  - id: message
    type: text
    label: 診断対象リポジトリ（URL を含む指示）
    required: true
    placeholder: "https://github.com/<owner>/<repo> を含む監査指示"
    default: "Audit https://github.com/Fogrexon/CGEngine — clone it, run parallel security scouts, consolidate findings, author exact before/after patches, evaluate with a second model (revise on REVISE), then attempt a structured GitHub PR."
  - id: maxFindings
    type: number
    label: 最大 findings 数（consolidator の目安）
    required: false
    default: 8
    min: 1
    max: 15
    step: 1
  - id: maxRevisions
    type: number
    label: REVISE 時の再パッチ上限（evaluate_audit ループ）
    required: false
    default: 2
    min: 0
    max: 5
    step: 1
    description: 初回評価後、REVISE ならパッチ修正→再評価を最大この回数まで繰り返す。REJECT/APPROVE で打ち切り。
  - id: allowWrite
    type: boolean
    label: パッチ適用を許可（要 AGENT_ENV_AUDIT_ALLOW_WRITE=1）
    required: false
    default: false
    description: 実際の許可は環境変数 AGENT_ENV_AUDIT_ALLOW_WRITE=1。
  - id: allowPr
    type: boolean
    label: create_pr を許可（要 AGENT_ENV_AUDIT_ALLOW_PR=1）
    required: false
    default: false
    description: 実際の許可は環境変数 AGENT_ENV_AUDIT_ALLOW_PR=1。
