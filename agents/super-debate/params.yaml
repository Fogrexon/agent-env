apiVersion: agent-env/v1
kind: AgentParams
agentId: super-debate
title: Super Debate
description: >
  Cursor 上のマルチモデル議論。Standard はミドルレンジ4モデル + GPT-5.6 Sol まとめ。
  Max Mode は Grok 4.5 / GPT-5.6 Sol / Claude Opus 5 / Gemini 3.1 Pro の詳細討論、
  パネリスト全文の成果物出力、Claude Opus 5 による詳細まとめ。
fields:
  - id: mode
    type: enum
    label: モード
    required: false
    default: standard
    description: >
      standard = ミドルレンジ討論。max = 上位モデル・詳細分量・討論全文を成果物に出力。
    options:
      - value: standard
        label: Standard
      - value: max
        label: Max Mode
  - id: message
    type: text
    label: 議題
    required: true
    placeholder: "例: Remote work should be the default for small engineering teams"
    default: "Remote work should be the default for small engineering teams"
  - id: documents
    type: files
    label: 参考資料（任意 / PDF・Markdown・テキスト）
    delivery: content
    required: false
    description: 全パネリストが証拠として参照します。Cursor は画像のみ対応のため、PDF / テキストは自動でテキスト抽出して渡します。
    accept:
      - .pdf
      - .md
      - .txt
      - .csv
      - .json
      - .yaml
