apiVersion: agent-env/v1
kind: AgentParams
agentId: super-debate
title: Super Debate
description: >
  Cursor 上のミドルレンジ4モデル（Grok 4.5 / GPT-5.6 Terra / Sonnet 5 / Gemini 3.6 Flash）が
  並列で議論し、GPT-5.6 Sol が主張要約と最終結論を出す。
fields:
  - id: message
    type: text
    label: 議題
    required: true
    placeholder: "例: Remote work should be the default for small engineering teams"
    default: "Remote work should be the default for small engineering teams"
